[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-agent"
version = "0.3.0"
description = "Privacy-first financial statement ingestion and classification pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.10,<3",
]

[project.scripts]
finance-agent = "finance_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
pdf = [
  "pdfplumber>=0.11,<1",
  "reportlab>=4.2,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finance_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
